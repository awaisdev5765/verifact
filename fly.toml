# Fly.io deployment — see DEPLOY.md
app = "verifact"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  VERIFACT_LEDGER_PATH = "/data/ledger.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # webhooks must always be receivable
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[mounts]
  source = "verifact_data"
  destination = "/data"
